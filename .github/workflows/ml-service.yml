name: ml-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service.yml'
  pull_request:
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service.yml'

defaults:
  run:
    working-directory: ml-service

jobs:
  test:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      ML_SERVICE_SECRET: 'ci-secret'
      ML_ADMIN_SECRET: 'ci-admin-secret'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.local.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.local.txt
          pip install ruff pip-audit

      - name: Lint (ruff)
        run: ruff check app tests --output-format=github
        continue-on-error: true

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Dependency audit (advisory)
        run: pip-audit --strict --requirement requirements.local.txt
        continue-on-error: true

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: false
          load: true
          tags: lavish-ml-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm \
            -e ML_SERVICE_SECRET=ci-secret \
            -e ML_ADMIN_SECRET=ci-admin-secret \
            -d --name ml-smoke -p 8000:8000 lavish-ml-service:ci
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo "healthy"
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/health
          docker stop ml-smoke
