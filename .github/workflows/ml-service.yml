name: Deploy ML Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ML to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ML_HOST }}
          username: ${{ secrets.ML_USER }}
          key: ${{ secrets.ML_SSH_KEY }}
          script: |
            cd /root/Lavish-Fashion
            git pull origin main
            cd ml-service
            pip install -r requirements.txt
            pm2 restart ml-service || pm2 start app.py --name ml-service